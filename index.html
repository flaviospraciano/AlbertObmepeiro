/* VOICE: jogo olímpico alegre, para crianças de 11–13 anos, encorajador e claro.

   COLOUR and TYPE: roxo elétrico dominante, laranja-sol de apoio, rosa-choque e verde-limão como acentos; Fredoka + Nunito.

:root{color-scheme:light;--bg:#F5F0FF;--sf:#FFFFFF;--sf2:#F1EAFF;--ink:#1B1035;--soft:#5D5378;--faint:#9890AE;--line:#E4DAF7;--line2:#D2C4F0;

:root[data-theme=dark]{color-scheme:dark;--bg:#120A26;--sf:#1D1338;--sf2:#251945;--ink:#F2ECFF;--soft:#B8ABDA;--faint:#8476AA;--line:#2F2252;--line2:#3B2C66;--pu-s:#2C1A5E;--or-s:#3A2510;--pk-s:#3E1330;--gr-s:#0F3528;--rd-s:#3D1420;--bl-s:#10294A;--lk:#3B2F5C;--lk-d:#2B2147}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#120A26;--sf:#1D1338;--sf2:#251945;--ink:#F2ECFF;--soft:#B8ABDA;--faint:#8476AA;--line:#2F2252;--line2:#3B2C66;--pu-s:#2C1A5E;--or-s:#3A2510;--pk-s:#3E1330;--gr-s:#0F3528;--rd-s:#3D1420;--bl-s:#10294A;--lk:#3B2F5C;--lk-d:#2B2147}}
*{box-sizing:border-box;min-width:0}

table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}td.n,th.n{text-align:right}

const fx=$('#fx'),ctx=fx.getContext('2d');let parts=[];
function confetti(n=120){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;fx.width=innerWidth;fx.height=innerHeight;const cols=['#FF2E88','#FFD23F','#16C47F','#1E9BFF','#6A2BF0','#FF8A00'];for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,s:Math.random()*8+4,c:cols[i%6],r:Math.random()*6,l:90});if(parts.length===n)requestAnimationFrame(tick)}
function tick(){ctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.l-->0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()}if(parts.length)requestAnimationFrame(tick);else ctx.clearRect(0,0,fx.width,fx.height)}
