<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Albert OBMEPeiro</title>
<meta name="theme-color" content="#5B1FD1">
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<link rel="icon" href="icons/owl.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Albert OBMEPeiro">
<meta name="description" content="Albert OBMEPeiro: treine as questões da 1ª fase da OBMEP (Nível 1) jogando.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: jogo olímpico alegre, para crianças de 11–13 anos, encorajador e claro.
   IDEA: um caderno de olimpíada que vira videogame — trilha de fases, vidas, combos e um mentor (a coruja Albert).
   PICTURE: a prova original da OBMEP (imagem fiel) no centro de cada fase; a trilha de fases na tela inicial.
   COLOUR and TYPE: roxo elétrico dominante, laranja-sol de apoio, rosa-choque e verde-limão como acentos; Fredoka + Nunito.
   LAYOUT: coluna única de app (máx. 600px), barra superior de status, abas inferiores, folhas que sobem para feedback. */
:root{color-scheme:only light;--bg:#F5F0FF;--sf:#FFFFFF;--sf2:#F1EAFF;--ink:#1B1035;--soft:#5D5378;--faint:#9890AE;--line:#E4DAF7;--line2:#D2C4F0;
--pu:#6A2BF0;--pu-d:#4A16B8;--pu-s:#ECE2FF;--or:#FF8A00;--or-d:#D66A00;--or-s:#FFF0DC;--pk:#FF2E88;--pk-d:#C8106A;--pk-s:#FFE1EF;
--gr:#16C47F;--gr-d:#0C9A62;--gr-s:#DBFBEC;--rd:#FF3B4E;--rd-d:#C61F31;--rd-s:#FFE3E6;--yl:#FFD23F;--yl-d:#D9A800;--bl:#1E9BFF;--bl-d:#0B72C9;--bl-s:#DFF1FF;--lk:#CFC7E0;--lk-d:#ADA3C4;
--disp:"Fredoka","Trebuchet MS",system-ui,sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif}
:root[data-theme=dark]{color-scheme:dark;--bg:#120A26;--sf:#1D1338;--sf2:#251945;--ink:#F2ECFF;--soft:#B8ABDA;--faint:#8476AA;--line:#2F2252;--line2:#3B2C66;--pu-s:#2C1A5E;--or-s:#3A2510;--pk-s:#3E1330;--gr-s:#0F3528;--rd-s:#3D1420;--bl-s:#10294A;--lk:#3B2F5C;--lk-d:#2B2147}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#120A26;--sf:#1D1338;--sf2:#251945;--ink:#F2ECFF;--soft:#B8ABDA;--faint:#8476AA;--line:#2F2252;--line2:#3B2C66;--pu-s:#2C1A5E;--or-s:#3A2510;--pk-s:#3E1330;--gr-s:#0F3528;--rd-s:#3D1420;--bl-s:#10294A;--lk:#3B2F5C;--lk-d:#2B2147}}
*{box-sizing:border-box;min-width:0}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,.alt,.tab{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:700 16px/1.5 var(--body);overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
.hide{display:none!important}
.app{max-width:600px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;margin:0 -16px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;font:700 1.15rem var(--disp)}
.brand img{width:34px;height:34px;border-radius:10px}
.pill{display:flex;align-items:center;gap:4px;font-weight:900;font-size:.92rem;padding:5px 9px;border-radius:12px;background:var(--sf);border:2px solid var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sf);border-top:2px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:2px solid transparent;border-radius:14px;padding:6px 2px;font-size:.72rem;font-weight:900;color:var(--soft);position:relative;min-height:52px}
.tab b{font-size:1.35rem;line-height:1.1}.tab[aria-current=true]{border-color:var(--pu);background:var(--pu-s);color:var(--pu)}
.tab .dot{position:absolute;top:3px;right:16%;min-width:18px;height:18px;border-radius:9px;background:var(--rd);color:#fff;font-size:.66rem;display:grid;place-items:center;padding:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 18px;min-height:50px;font-weight:900;font-size:1rem;background:var(--pu);color:#fff;box-shadow:0 5px 0 var(--pu-d);transition:transform .06s,box-shadow .06s;text-align:center}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--pu-d)}
.btn.full{width:100%}.btn.sm{padding:9px 14px;min-height:44px;font-size:.9rem;border-radius:13px}
.btn.or{background:var(--or);box-shadow:0 5px 0 var(--or-d)}.btn.pk{background:var(--pk);box-shadow:0 5px 0 var(--pk-d)}
.btn.gr{background:var(--gr);box-shadow:0 5px 0 var(--gr-d)}.btn.rd{background:var(--rd);box-shadow:0 5px 0 var(--rd-d)}.btn.bl{background:var(--bl);box-shadow:0 5px 0 var(--bl-d)}
.btn.gh{background:var(--sf);color:var(--ink);border:2px solid var(--line2);box-shadow:0 5px 0 var(--line2)}
.btn:disabled{background:var(--lk);color:var(--faint);box-shadow:0 5px 0 var(--lk-d);cursor:not-allowed}
.card{background:var(--sf);border:2px solid var(--line);border-radius:20px;padding:16px}
.lbl{font:900 .8rem var(--body);color:var(--faint);margin:24px 0 10px}
.muted{color:var(--soft)}.small{font-size:.9rem}.tiny{font-size:.78rem}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--or),var(--pk));transition:width .5s}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.input{width:100%;font:800 16px var(--body);padding:14px;border-radius:14px;border:2px solid var(--line2);background:var(--sf);color:var(--ink)}
/* herói */
.hero{margin:16px 0 0;border-radius:26px;padding:20px;color:#fff;background:radial-gradient(circle at 85% 10%,#FF9BD2 0,transparent 40%),linear-gradient(135deg,#7B2FF7,#F107A3 60%,#FF8A00);box-shadow:0 6px 0 #4A16B8;position:relative;overflow:hidden}
.hero h1{font-size:clamp(1.6rem,6vw,2.1rem)}.hero p{margin:6px 0 0;opacity:.95}
.hero .owl{position:absolute;right:-6px;bottom:-10px;width:118px;opacity:.95}
.bubble{background:#fff;color:#1B1035;border-radius:16px;padding:10px 14px;margin-top:12px;max-width:72%;font-weight:800;font-size:.95rem;position:relative}
.bubble::after{content:"";position:absolute;right:-10px;bottom:14px;border:8px solid transparent;border-left-color:#fff}
.lvl{display:flex;gap:12px;align-items:center;margin-top:14px}.lvl .bar{flex:1;background:rgba(255,255,255,.3);height:12px}.lvl .bar i{background:var(--yl)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.qk{border:0;border-radius:18px;padding:12px 6px;color:#fff;font-weight:900;font-size:.82rem;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:92px;justify-content:center}
.qk b{font-size:1.7rem;line-height:1}
/* trilha */
.world{border-radius:22px;padding:16px;color:#fff;margin:22px 0 6px;position:relative;overflow:hidden}
.world h2{font-size:1.35rem}.world p{margin:4px 0 0;font-size:.88rem;opacity:.92;max-width:40ch}.world .k{font-weight:900;font-size:.78rem;opacity:.9}
.world .badge{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);border-radius:12px;padding:5px 10px;font-weight:900;font-size:.82rem}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 8px}
.node{width:76px;height:76px;border-radius:50%;border:0;position:relative;background:var(--wc);box-shadow:0 6px 0 color-mix(in srgb,var(--wc) 60%,#000),inset 0 -6px 0 rgba(0,0,0,.15);color:#fff;font:700 1.5rem var(--disp)}
.node.lock{background:var(--lk);box-shadow:0 6px 0 var(--lk-d);color:var(--faint)}
.node.cur{animation:pulse 1.8s ease-in-out infinite}
.node .st{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:.85rem;letter-spacing:-2px;white-space:nowrap;color:var(--yl);text-shadow:0 1px 0 #0006}
.node .tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--sf);border:2px solid var(--line2);color:var(--pu);font:900 .82rem var(--body);padding:5px 11px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 color-mix(in srgb,var(--wc) 60%,#000),0 0 0 10px color-mix(in srgb,var(--wc) 25%,transparent)}}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
/* listas */
.cat{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sf);border:2px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line2);margin-bottom:12px}
.cat .ic{width:52px;height:52px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:1.6rem;color:#fff}
.cat h3{font-size:1.05rem}.cat .bar{height:9px;margin-top:6px}
.years{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.yr{border:2px solid var(--line);background:var(--sf);border-radius:18px;padding:14px 6px;box-shadow:0 4px 0 var(--line2);text-align:center}
.yr b{display:block;font:700 1.45rem var(--disp)}.yr span{font-size:.75rem;color:var(--soft);font-weight:900}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:2px solid var(--line2);background:var(--sf);border-radius:12px;padding:8px 12px;min-height:40px;font-weight:900;font-size:.86rem}
.seg button[aria-pressed=true]{border-color:var(--pu);background:var(--pu-s);color:var(--pu)}
.qgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.qg{border:2px solid var(--line2);background:var(--sf);border-radius:12px;min-height:44px;font-weight:900}
.qg.ok{background:var(--gr-s);border-color:var(--gr);color:var(--gr-d)}.qg.no{background:var(--rd-s);border-color:var(--rd);color:var(--rd-d)}
.miss{display:flex;gap:12px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:16px;background:var(--sf);margin-bottom:10px;width:100%;text-align:left}
.mth{width:96px;height:66px;flex:none;border-radius:10px;background:var(--sf2);border:1px solid var(--line);font-size:.66rem;line-height:1.25;padding:6px;overflow:hidden;color:var(--soft);font-weight:800;text-align:left}
.miss img{width:84px;height:62px;object-fit:cover;object-position:top left;border-radius:10px;border:1px solid var(--line);background:#fff;flex:none}
.tag{display:inline-block;font-size:.72rem;font-weight:900;border-radius:99px;padding:2px 9px;background:var(--sf2);color:var(--soft);margin:2px 4px 0 0}
.tag.rd{background:var(--rd-s);color:var(--rd-d)}.tag.gr{background:var(--gr-s);color:var(--gr-d)}.tag.or{background:var(--or-s);color:var(--or-d)}
.ach{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ac{text-align:center;padding:12px 6px;border-radius:16px;background:var(--sf);border:2px solid var(--line);font-size:.75rem;font-weight:900}
.ac b{display:block;font-size:1.9rem}.ac.off{opacity:.35;filter:grayscale(1)}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}td.n,th.n{text-align:right}
/* texto transcrito */
.qbox{background:var(--sf);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.qt{margin:0 0 10px;font:700 1.08rem/1.55 var(--body)}.qt:last-child{margin-bottom:0}
.qf{background:#fff;border-radius:12px;padding:6px;margin:4px 0 12px;text-align:center;cursor:zoom-in}.qv{cursor:default;padding:10px}
.qf img{max-width:100%;max-height:340px;height:auto}.qf,.qf *{color-scheme:only light;forced-color-adjust:none}.qph{border-radius:14px;display:block;margin:0 auto}.qcv{max-width:100%;max-height:340px;height:auto;display:block;margin:0 auto;object-fit:contain}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;line-height:1.15;margin:0 2px}.fr span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.altl{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.altl .alt{display:flex;align-items:center;gap:12px;text-align:left;font:700 1rem/1.4 var(--body);padding:10px 12px;min-height:56px}
.altl .alt .L{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--line2);display:grid;place-items:center;font:700 1.05rem var(--disp)}
.altl .alt.sel .L{border-color:var(--bl)}.altl .alt.ok .L{border-color:var(--gr)}.altl .alt.no .L{border-color:var(--rd)}
.steps{margin:8px 0;padding-left:22px}.steps li{margin:6px 0;font-weight:700;line-height:1.5}.steps li.nf{list-style:none;margin-left:-22px}
.expl{background:var(--sf);border-radius:14px;padding:12px;margin:10px 0}
.link{background:none;border:0;color:var(--pu);font-weight:900;text-decoration:underline;padding:12px 0;min-height:44px}
/* aprender */
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hb{border:0;border-radius:20px;color:#fff;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;font-weight:900;font-size:1rem;min-height:104px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.hb b{font-size:1.8rem;line-height:1.1}.hb span{font-size:.78rem;opacity:.9;font-weight:800}
.gl{background:none;border:0;padding:0;font:inherit;color:var(--pu);text-decoration:underline dotted 2px;text-underline-offset:3px;cursor:help}
.glfig{background:#fff;border-radius:14px;padding:6px;margin:8px 0}
.glg{display:flex;flex-wrap:wrap;gap:8px}.glb{border:2px solid var(--line2);background:var(--sf);border-radius:12px;padding:9px 12px;font-weight:800;min-height:42px;text-transform:capitalize}
.stc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--sc);background:color-mix(in srgb,var(--sc) 12%,var(--sf));border-radius:16px;padding:10px 12px;margin:10px 0 4px;color:var(--ink);box-shadow:0 3px 0 var(--sc)}
.stc>span:first-child{font-size:1.6rem}.stc small{display:block;font-size:.72rem;color:var(--soft);font-weight:800}.stc b{font:700 1.02rem var(--disp)}
.simp{background:var(--bl-s);border-radius:14px;padding:12px;margin-top:10px}
.sisw{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
.sisw .pbody{padding-bottom:60px}
.fbx{border-radius:18px;padding:14px;margin-top:14px}.fbx.ok{background:var(--gr-s)}.fbx.no{background:var(--rd-s)}.fbx h3{font-size:1.25rem}
.fcard{font:700 clamp(2rem,10vw,3rem)/1.2 var(--disp);margin:30px 0;padding:30px 10px;background:var(--sf);border:3px solid var(--line2);border-radius:24px;box-shadow:0 6px 0 var(--line2)}
.fopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.fo{min-height:72px;border-radius:18px;border:3px solid var(--line2);background:var(--sf);font:700 1.6rem var(--disp);box-shadow:0 4px 0 var(--line2);color:var(--ink)}
.fo.ok{background:var(--gr-s);border-color:var(--gr);color:var(--gr-d)}.fo.no{background:var(--rd-s);border-color:var(--rd);color:var(--rd-d)}
/* questão do dia + difícil */
.daily{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:22px;padding:14px;margin-top:14px;color:#fff;background:linear-gradient(135deg,#FF8A00,#E8007D 70%,#6A2BF0);box-shadow:0 5px 0 #A3005A}
.daily small{display:block;font-weight:900;opacity:.9;font-size:.78rem}.daily b{display:block;font:700 1.05rem/1.25 var(--disp);margin:2px 0 6px}
.dl-ic{font-size:2.2rem;animation:bob2 2s ease-in-out infinite}@keyframes bob2{50%{transform:translateY(-4px) rotate(8deg)}}
.hardb{display:block;background:linear-gradient(135deg,#FF3B4E,#FF8A00);color:#fff;border-radius:14px;padding:10px 12px;font-weight:800}
.hardbtn{background:linear-gradient(135deg,#FF3B4E,#FF8A00);box-shadow:0 5px 0 #B8283A}
.numin{display:flex;gap:10px;align-items:center}
.numin .btn{flex:none}
.numin input{flex:1;width:100%;font:900 1.4rem var(--body);padding:14px;border-radius:14px;border:3px solid var(--line2);background:var(--sf);color:var(--ink);min-width:0}
/* degraus e conexões */
.dtip{display:flex;gap:10px;align-items:flex-start;background:var(--pu-s);border-radius:16px;padding:12px;font-weight:800;margin-bottom:8px}.dtip span{font-size:1.5rem;line-height:1}
.dq{background:var(--sf);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin:10px 0}.dq summary{font-weight:900;cursor:pointer}
.dstep{display:flex;gap:12px;align-items:flex-start;background:var(--sf);border:2px solid var(--line);border-radius:18px;padding:12px;margin:10px 0;animation:up .25s ease-out}
.dstep p{margin:0 0 8px;font-weight:700;line-height:1.5}.dn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pu);color:#fff;display:grid;place-items:center;font:700 .95rem var(--disp)}
.blank{display:inline-block;min-width:44px;text-align:center;border-bottom:3px dashed var(--pu);color:var(--pu);font-weight:900;margin:0 3px}
.filled{padding:1px 6px;border-radius:8px}.filled.ok{background:var(--gr-s);color:var(--gr-d)}.filled.no{background:var(--rd-s);color:var(--rd-d)}
.dform input{font-size:1.1rem;padding:10px 12px}.dsk{padding:6px 0;min-height:32px;font-size:.88rem}
.fbar{width:100%;max-width:320px;display:block;margin:4px 0 8px}
.conn{background:var(--or-s);border-left:5px solid var(--or);border-radius:14px;padding:12px;margin:10px 0}.conn .btn{margin:2px 6px 2px 0}
.veil{filter:blur(6px);user-select:none;transition:filter .3s}.veil.on{filter:none}
.dpk{display:flex;flex-direction:column;gap:8px}.dpk .tile{text-align:left}
.tile{border:2px solid var(--line2);background:var(--sf);border-radius:14px;padding:10px 12px;font-weight:800;box-shadow:0 3px 0 var(--line2);min-height:44px;color:var(--ink)}
.dcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dc{border-radius:10px;background:var(--sf2);border:1px solid var(--line);text-align:center;font-weight:900;padding:4px 0;color:var(--faint)}.dc small{display:block;font-size:.66rem}
.dc.ok{background:var(--gr-s);color:var(--gr-d);border-color:var(--gr)}.dc.no{background:var(--rd-s);color:var(--rd-d);border-color:var(--rd)}
.rbtn{border:0;background:var(--sf);border:2px solid var(--line);border-radius:12px;font-size:1.05rem;padding:4px 8px;margin-left:6px;cursor:pointer}.rbtn.on{border-color:var(--pu);background:var(--pu-s,#eee)}
#rasc{position:fixed;inset:0;z-index:90;background:rgba(255,255,255,.18);display:flex;flex-direction:column}#rasc canvas{flex:1;touch-action:none;width:100%;display:block}
#rasc .rt{display:flex;gap:6px;align-items:center;justify-content:center;padding:8px;background:var(--sf);border-bottom:2px solid var(--line);flex-wrap:wrap}
#rasc .rt button{border:2px solid var(--line);background:var(--sf);border-radius:12px;padding:6px 10px;font-weight:800;cursor:pointer;color:var(--ink)}#rasc .rt button.sel{border-color:var(--pu)}
#rasc .cd{width:26px;height:26px;border-radius:50%;padding:0!important}

.vpath{padding-top:14px}.lesn{width:64px;height:64px;font-size:1.5rem}.tboss{width:84px;height:84px;font-size:2.2rem;background:linear-gradient(135deg,#6A2BF0,var(--wc));margin-top:10px}.boss{width:96px;height:96px;font-size:2.6rem;--wc:#E8007D;background:linear-gradient(135deg,#6A2BF0,#E8007D)}

.hintbox{background:var(--yl);background:color-mix(in srgb,var(--yl) 30%,var(--sf));border:2px solid var(--yl-d);border-radius:16px;padding:10px 12px;margin:10px 0;font-weight:700}
.hardtip{background:var(--rd-s);border:2px solid var(--rd);border-radius:16px;padding:10px 12px;margin:0 0 10px;font-weight:700}
.lhero{border-radius:22px;color:#fff;text-align:center;padding:18px}.lhero small{font-weight:900;opacity:.9}.lhero h2{font-size:1.6rem}

.learn{background:var(--sf);border-left:5px solid var(--or);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.92rem}
.learn ul{margin:6px 0 0;padding-left:18px}.learn li{margin:3px 0}
@keyframes up{from{transform:translateY(50px);opacity:.3}}
.combo{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:60;background:var(--yl);color:#3A2600;font:700 1.05rem var(--disp);padding:8px 18px;border-radius:99px;box-shadow:0 4px 0 var(--yl-d);animation:pop 1.1s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{transform:translate(-50%,12px) scale(.7);opacity:0}20%{transform:translate(-50%,0) scale(1.08);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-3px)}}
.timer{font-weight:900;color:var(--pu);font-variant-numeric:tabular-nums}

.stars{font-size:2.6rem;letter-spacing:6px;color:var(--yl);text-shadow:0 3px 0 var(--yl-d)}
.avs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}

.avs button[aria-pressed=true]{border-color:var(--pk);background:var(--pk-s)}
.acct{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:2px solid var(--line);background:var(--sf);border-radius:18px;margin-bottom:10px;text-align:left;box-shadow:0 4px 0 var(--line2)}
.acct .av{font-size:1.8rem;width:48px;height:48px;border-radius:14px;background:var(--pu-s);display:grid;place-items:center}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:95;font-weight:900;font-size:.9rem;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.alts{gap:5px}.alt{font-size:1.3rem;min-height:56px}.years{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hbw{width:100%;margin-bottom:12px;min-height:96px}.ah{font-size:1.3rem;margin:16px 0 8px}.ap{font-size:1.05rem;line-height:1.55;margin:0 0 12px}.aq{background:var(--sf);border:2px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;font-weight:800;font-size:1.08rem;line-height:1.5}.astep{display:flex;gap:10px;align-items:flex-start;background:var(--sf);border-radius:14px;padding:12px;margin:8px 0;animation:pop .35s ease;line-height:1.5}.astep>span{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pu);color:#fff;display:grid;place-items:center;font-weight:900}.ares{background:var(--gr-s);border-radius:14px;padding:12px;margin:10px 0;font-size:1.1rem}.atrap{background:var(--rd-s);border:2px solid var(--rd);border-radius:18px;padding:14px 16px;margin-top:14px;line-height:1.55}.asum{background:var(--gr-s);border:2px solid var(--gr);border-radius:18px;padding:14px 16px;margin-top:14px;line-height:1.6}.asum li{margin:4px 0}.pbar{height:12px;border-radius:9px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;border-radius:9px;transition:width .3s}.nlab{margin-bottom:34px!important}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}html.qwhite{--bg:#FFFFFF;--sf:#FFFFFF;--sf2:#F7F4FF}html.qwhite body{background:#fff}</style>

<body>
<canvas id="fx"></canvas>
<div id="root"></div>
<script src="questoes.js"></script>
<script src="aulas.js"></script>
<script src="aprender.js"></script>
<script src="gemeas.js"></script>
<script src="firebase-config.js" onerror="window.FB_CONFIG=null"></script>
<script>
{
const $=s=>document.querySelector(s), root=$('#root');
const ADMIN_PASS='728497', KEY='albert_obmepeiro_v1';
const QS=window.QUESTOES||[]; const BYID={}; QS.forEach(q=>BYID[q.id]=q);
const CATS={
A:{n:'Aritmética e operações',e:'➕',c:'#FF8A00',t:['Leia a conta inteira antes de calcular: às vezes dá para agrupar números “redondos”.','Confira a ordem das operações: multiplicação e divisão vêm antes de soma e subtração.','Estime o resultado antes; se a sua resposta fugir muito da estimativa, refaça.'],err:'Errar um passo da conta por pressa, ou ignorar parênteses e a ordem das operações.'},
F:{n:'Frações, decimais e %',e:'🍕',c:'#FF2E88',t:['Desenhe a fração: divida uma barra ou pizza em partes iguais.','Fração “de” alguma coisa = multiplicar. Ex.: 3/4 de 20 = 15.','Para comparar frações, use o mesmo denominador ou transforme em decimal.'],err:'Confundir a parte com o todo, ou somar numeradores e denominadores separadamente.'},
G:{n:'Geometria: áreas e perímetros',e:'📐',c:'#1E9BFF',t:['Quebre a figura em quadradinhos, retângulos e triângulos que você conhece.','Às vezes é mais fácil calcular a área de fora e subtrair a parte que sobra.','Perímetro é o contorno; área é o “piso”. Não misture os dois!'],err:'Contar lados internos no perímetro, ou esquecer que meio quadradinho + meio quadradinho = um inteiro.'},
E:{n:'Visão espacial',e:'🧊',c:'#16C47F',t:['Em dados, faces opostas somam 7: use isso para descobrir faces escondidas.','Em dobraduras, refaça o caminho ao contrário (desdobrando) e marque os cortes por simetria.','Imagine-se olhando de cima, de frente e de lado; desenhe no rascunho.'],err:'Esquecer que a figura vira espelhada ao dobrar ou girar, ou contar cubos que estão escondidos.'},
C:{n:'Contagem e combinatória',e:'🎲',c:'#8F3BFF',t:['Organize em lista ou tabela: assim você não esquece nem repete casos.','Princípio multiplicativo: escolhas independentes se multiplicam.','Comece pelo caso com mais restrições.'],err:'Contar duas vezes o mesmo caso ou pular possibilidades sem perceber.'},
L:{n:'Lógica e raciocínio',e:'🧠',c:'#6A2BF0',t:['Anote as pistas em uma tabela de “sim/não”.','Teste cada alternativa: a que não contradiz nenhuma pista é a resposta.','Procure a pista mais forte (a que elimina mais casos) e comece por ela.'],err:'Usar uma informação que o enunciado não deu, ou parar antes de testar todas as pistas.'},
S:{n:'Padrões e sequências',e:'🔁',c:'#00B8C4',t:['Escreva os primeiros termos e descubra o que se repete.','Em ciclos (dias da semana, giros), use o resto da divisão.','Monte uma tabela “posição × valor” para enxergar a regra.'],err:'Contar a partir de 0 ou de 1 de forma errada (erro de “um a mais”).'},
N:{n:'Números e algarismos',e:'🔢',c:'#E8007D',t:['Use as regras de divisibilidade (por 2, 3, 5, 9…).','Algarismos vão de 0 a 9; em contas armadas, olhe primeiro a casa das unidades.','Para “maior/menor número”, coloque os algarismos maiores/menores nas casas de mais valor.'],err:'Esquecer o “vai um” ou confundir algarismo com número.'},
M:{n:'Medidas, tempo e dinheiro',e:'⏰',c:'#FF5A1F',t:['Transforme tudo para a mesma unidade antes de fazer contas (cm, m, min, h…).','Dinheiro: trabalhe em centavos para evitar erros com vírgula.','Em horas, lembre que 1 hora = 60 minutos, não 100.'],err:'Misturar unidades diferentes na mesma conta.'},
T:{n:'Tabelas e gráficos',e:'📊',c:'#0BAA5C',t:['Leia o título, as legendas e o que mede cada eixo antes de tudo.','Marque com o dedo a linha e a coluna certas da tabela.','Some/compare só os valores que a pergunta pede.'],err:'Ler a linha ou a barra errada, ou ignorar a escala do gráfico.'}};
const DIF={1:{n:'Fácil',c:'gr'},2:{n:'Médio',c:'or'},3:{n:'Difícil',c:'rd'}};
const WHY=[['pressa','Li rápido demais'],['conta','Errei a conta'],['figura','Não entendi a figura'],['conteudo','Não sabia o conteúdo'],['chute','Chutei']];
const WHYTIP={pressa:'Antes de marcar, sublinhe a pergunta final do enunciado. Muitas questões da OBMEP perguntam algo diferente do que parece!',conta:'Refaça a conta de outro jeito (ou de trás para frente) para conferir. Rascunho organizado evita erro bobo.',figura:'Toque na imagem para ampliar e redesenhe a figura no papel. Marque medidas e pontos importantes.',conteudo:'Ótimo que você descobriu! Leia a solução oficial com calma e depois tente esta questão de novo amanhã no Reforço.',chute:'Chutar faz parte, mas tente eliminar alternativas impossíveis primeiro: cada uma eliminada aumenta sua chance.'};
const AV=['🦉','🦊','🐼','🐯','🦁','🐸','🐙','🦄','🐧','🐨','🚀','⭐'];
const LEVELS=[[0,'Aprendiz'],[150,'Curioso'],[400,'Contador'],[800,'Calculista'],[1400,'Estrategista'],[2200,'Albertzinho'],[3200,'Albertão'],[4500,'Craque OBMEP'],[6200,'Medalhista'],[8500,'Lenda Olímpica']];
const HEART_MAX=5, STAGE=8;
const PRAISE=['Mandou bem!','Isso aí, craque!','Albert aprova! 🦉','Raciocínio de medalhista!','Perfeito!','Que cabeça!','Show de bola!'];
const CHEER=['Errar é parte do treino. Bora entender!','Calma: cada erro vira aprendizado.','Respira e olha a solução — da próxima você acerta!','Os medalhistas também erraram muito antes.'];
// ---------- estado ----------
let DB; try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}
DB=DB||{users:{},cur:null,ov:{},wrongAll:{}};
let pushT=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){};const u=DB.cur&&DB.users[DB.cur];if(u&&!u.adm&&CL.on){u.upd=Date.now();clearTimeout(pushT);pushT=setTimeout(()=>CL.push(u),1500)}};
const CL={on:false,db:null,auth:null,user:null,ready:Promise.resolve(false),
  init(){if(!window.FB_CONFIG||!FB_CONFIG.apiKey)return this.ready=Promise.resolve(false);
    const load=src=>new Promise((r,j)=>{const t=document.createElement('script');t.src=src;t.onload=r;t.onerror=j;document.head.appendChild(t)});
    const B='https://cdn.jsdelivr.net/npm/firebase@10.12.2/';
    return this.ready=load(B+'firebase-app-compat.js').then(()=>Promise.all([load(B+'firebase-auth-compat.js'),load(B+'firebase-firestore-compat.js')]))
      .then(()=>{firebase.initializeApp(FB_CONFIG);this.auth=firebase.auth();this.db=firebase.firestore();this.on=true;
        return new Promise(res=>{const off=this.auth.onAuthStateChanged(u=>{this.user=u;off();res(true)})})}).catch(e=>{console.warn('Firebase indisponível',e);return false})},
  col(){return this.db.collection('jogadores')},
  push(u){if(!this.on||!this.user||this.user.uid!==u.id)return;this.col().doc(u.id).set(JSON.parse(JSON.stringify(u))).catch(e=>console.warn(e))},
  async get(id){const r=await this.col().doc(id).get();return r.exists?r.data():null},
  async all(){const q=await this.col().get();return q.docs.map(d=>d.data())},
  async isAdmin(){try{const r=await this.db.collection('admins').doc(this.auth.currentUser.uid).get();return r.exists}catch(e){return false}},
  async signup(name,email,pass,av){const c=await this.auth.createUserWithEmailAndPassword(email,pass);this.user=c.user;const u=mkUser(c.user.uid,name,av);u.email=email;u.upd=Date.now();await this.col().doc(u.id).set(JSON.parse(JSON.stringify(u)));return u},
  async signin(email,pass){const c=await this.auth.signInWithEmailAndPassword(email,pass);this.user=c.user;let u=await this.get(c.user.uid);if(!u){u=mkUser(c.user.uid,email.split('@')[0],AV[0]);u.email=email;await this.col().doc(u.id).set(JSON.parse(JSON.stringify(u)))}const l=DB.users[u.id];if(l&&(l.upd||0)>(u.upd||0))u=l;return u},
  async out(){if(this.on){try{await this.auth.signOut()}catch(e){}}this.user=null}};
const slug=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
async function syncCur(){const u=DB.cur&&DB.users[DB.cur];if(!u||u.adm||!CL.on)return;try{const r=await CL.get(u.id);if(r&&(r.upd||0)>(u.upd||0)){DB.users[u.id]=r;localStorage.setItem(KEY,JSON.stringify(DB));render()}else CL.push(u)}catch(e){}}
const AP=window.APR||{STRAT:{},guessStrat:()=>'M',GLOS:{},G:[],sister:null,FL:{},flashCard:null};
QS.forEach(q=>{q.st=AP.guessStrat(q)});
for(const id in DB.ov){const q=BYID[id];if(q)Object.assign(q,DB.ov[id])}
let admin=false, tab='home', S=null;
const U=()=>DB.users[DB.cur];
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const days=n=>Date.now()+n*864e5;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const lvl=xp=>{let i=0;while(i<LEVELS.length-1&&xp>=LEVELS[i+1][0])i++;const a=LEVELS[i][0],b=(LEVELS[i+1]||[a+3000])[0];return{i,name:LEVELS[i][1],p:Math.min(100,(xp-a)/(b-a)*100),next:b}};
const H=id=>(U().h[id]=U().h[id]||{s:0,ok:0,no:0,box:0,due:0,why:{}});
const isMastered=id=>{const h=U().h[id];return h&&h.ok>0&&(h.no===0||h.box>=3)};
const dueList=()=>Object.entries(U().h).filter(([id,h])=>h.no>0&&h.box<3&&h.due<=Date.now()&&BYID[id]).map(([id])=>id);
const notebook=()=>Object.entries(U().h).filter(([id,h])=>h.no>0&&BYID[id]).sort((a,b)=>(b[1].no-b[1].ok)-(a[1].no-a[1].ok)).map(([id])=>id);
const dkey=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dayAgo=n=>dkey(new Date(Date.now()-n*864e5));
const LOG=u=>(u.log=u.log||{});
function checkin(u){const L=LOG(u),t=dayAgo(0);L[t]=L[t]||{n:0,ok:0,in:[]};const hm=new Date().toTimeString().slice(0,5);if(!L[t].in.includes(hm))L[t].in.push(hm);save()}
function missed(u){const L=LOG(u);const c=u.created||Date.now();let k=0;for(let i=1;i<=30;i++){const d=dayAgo(i);if(new Date(d+'T23:59')<new Date(c))break;if(!L[d]||!L[d].n)k++;else break}return k}
function mkUser(id,name,av){return {id,name,av,xp:0,streak:0,last:'',best:0,h:{},stg:{},yrs:{},ach:[],day:{d:'',n:0},goal:15,created:Date.now(),log:{}}}
function newUser(name,av){const id='u'+Date.now().toString(36);DB.users[id]=mkUser(id,name,av);return id}
// mundos da jornada
const WORLDS=[1,2,3].map(d=>{const qs=QS.filter(q=>q.d===d).sort((a,b)=>a.y-b.y||a.n-b.n);const st=[];for(let i=0;i<qs.length;i+=STAGE)st.push(qs.slice(i,i+STAGE).map(q=>q.id));return{d,st}});
const WINFO={1:['Mundo 1','Vale dos Números','Questões de aquecimento: as primeiras de cada prova.','linear-gradient(135deg,#16C47F,#00B8C4)','#16C47F'],2:['Mundo 2','Floresta das Formas','O meio da prova: aqui o raciocínio começa a apertar.','linear-gradient(135deg,#FF8A00,#FF2E88)','#FF8A00'],3:['Mundo 3','Montanha dos Craques','As finais da prova. Quem vence aqui pega medalha!','linear-gradient(135deg,#6A2BF0,#E8007D)','#6A2BF0']};
const stKey=(d,i)=>d+'-'+i;

['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
